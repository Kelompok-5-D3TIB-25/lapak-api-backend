services:
  app:
    image: shinsenter/laravel:php8.3-nginx
    container_name: lapak
    restart: no
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html
    environment:
      TZ: Asia/Jakarta
      APP_URL: http://localhost:8000
      ASSET_URL: http://localhost:8000
      APP_TIMEZONE: Asia/Jakarta
      LARAVEL_AUTO_MIGRATION: 0
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-lapak}
      DB_USERNAME: ${DB_USERNAME:-lapak}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      - db
    networks:
      - backend

  db:
    image: mysql:8.4.11
    container_name: lapak-db
    restart: no
    volumes:
      - db-data:/var/lib/mysql
    environment:
      TZ: Asia/Jakarta
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-lapak}
      MYSQL_USER: ${DB_USERNAME:-lapak}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    networks:
      - backend

networks:
  backend:

volumes:
  db-data:
